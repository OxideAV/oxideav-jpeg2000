[package]
name = "oxideav-jpeg2000"
version = "0.0.17"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-jpeg2000"
authors = ["Mark Karpeles"]
description = "Pure-Rust JPEG 2000 codec — Part 1 (T.800) + HTJ2K (T.814) decoder and encoder, J2K / JP2 / JPH containers."

readme = "README.md"
# crates.io 10 MiB cap: the conformance fixtures and fuzz corpus stay
# in the repository only.
exclude = ["/tests", "/fuzz"]
homepage = "https://github.com/OxideAV/oxideav-jpeg2000"
keywords = ["multimedia", "image", "jpeg2000", "jp2", "codec"]
categories = ["multimedia::encoding", "multimedia::images"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]
# Pulls in `oxideav-core` and exposes the `Decoder` / `Encoder` trait
# adapters, the `register()` entry point and the `VideoFrame` bridge.
# Disable for an `oxideav-core`-free build: the whole standalone image
# API (`probe` / `info` / `decode` / `encode` …) and the T.800 depth
# surface stay available.
registry = ["dep:oxideav-core"]
